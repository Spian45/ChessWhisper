plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spian.chesswhisper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.spian.chesswhisper'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so you can install it directly
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
